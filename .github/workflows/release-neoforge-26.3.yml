name: Release NeoForge 26.3

on:
  push:
    branches:
      - '26.3'
    paths:
      - '.github/workflows/release-neoforge-26.3.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0+26.3
          target_commitish: ${{ github.sha }}
          name: Chest Tracker 3.0.0 — NeoForge 26.3
          prerelease: true
          generate_release_notes: false
          body_path: CHANGELOG.md
          files: build/libs/chesttracker-3.0.0+26.3.jar
